<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN ENTRY // Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0512; --bg2:#12081f;
    --panel:rgba(20,10,38,0.72);
    --line:rgba(140,90,255,0.35);
    --text:#e9e2ff; --muted:#9a86c4;
    --neon-purple:#a855f7; --neon-blue:#3b9dff; --neon-pink:#ff4ecd;
    --neon-orange:#ff8a3d; --neon-green:#39ff88; --warn:#ffb84d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Rajdhani',system-ui,sans-serif;color:var(--text);line-height:1.5;
    min-height:100vh;padding:24px 18px 60px;
    background:
      radial-gradient(circle at 15% 8%, rgba(168,85,247,0.28), transparent 45%),
      radial-gradient(circle at 85% 6%, rgba(59,157,255,0.26), transparent 45%),
      radial-gradient(circle at 50% 60%, rgba(255,138,61,0.15), transparent 55%),
      radial-gradient(circle at 80% 95%, rgba(255,78,205,0.18), transparent 45%),
      linear-gradient(160deg,var(--bg),var(--bg2));
    background-attachment:fixed;
  }
  .wrap{max-width:1280px;margin:0 auto}
  .hero{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
    padding:14px 0 22px}
  .hero h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,4vw,40px);
    letter-spacing:3px;margin:0;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-purple),var(--neon-pink),var(--neon-orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(168,85,247,0.55))}
  .hero .sub{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--neon-blue);
    text-shadow:0 0 10px rgba(59,157,255,0.7);margin-top:4px}
  .up{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input[type=file]{color:var(--muted);font-size:13px}
  .tag{display:inline-block;background:rgba(8,4,18,0.7);border:1px solid var(--line);
    border-radius:20px;padding:3px 12px;font-size:12px;color:var(--muted);letter-spacing:1px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 8px 34px rgba(80,20,160,0.22),inset 0 0 24px rgba(120,60,220,0.07)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px;
    backdrop-filter:blur(10px)}
  .kpi .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-family:'Orbitron',sans-serif;font-size:26px;margin-top:8px;letter-spacing:0}
  .kpi.k1{border-color:rgba(57,255,136,0.5);box-shadow:0 0 20px rgba(57,255,136,0.18)}
  .kpi.k1 .val{color:var(--neon-green);text-shadow:0 0 12px rgba(57,255,136,0.5)}
  .kpi.k2{border-color:rgba(59,157,255,0.5);box-shadow:0 0 20px rgba(59,157,255,0.18)}
  .kpi.k2 .val{color:var(--neon-blue);text-shadow:0 0 12px rgba(59,157,255,0.5)}
  .kpi.k3{border-color:rgba(255,78,205,0.5);box-shadow:0 0 20px rgba(255,78,205,0.18)}
  .kpi.k3 .val{color:var(--neon-pink);text-shadow:0 0 12px rgba(255,78,205,0.5)}
  .kpi.k4{border-color:rgba(255,138,61,0.5);box-shadow:0 0 20px rgba(255,138,61,0.18)}
  .kpi.k4 .val{color:var(--neon-orange);text-shadow:0 0 12px rgba(255,138,61,0.5)}

  .grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:20px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .section-no{font-family:'Orbitron',sans-serif;color:var(--neon-orange);font-size:12px;
    letter-spacing:3px;margin-bottom:14px;text-shadow:0 0 10px rgba(255,138,61,0.5)}

  /* bar chart */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .bar-name{width:150px;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font-weight:600}
  .bar-track{flex:1;height:20px;background:rgba(8,4,18,0.6);border-radius:6px;overflow:hidden;
    border:1px solid rgba(140,90,255,0.2)}
  .bar-fill{height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--neon-purple),var(--neon-pink));
    box-shadow:0 0 12px rgba(255,78,205,0.5);transition:width .6s ease}
  .bar-val{width:110px;text-align:right;font-size:12.5px;color:var(--neon-green);
    font-variant-numeric:tabular-nums;font-weight:600}

  /* donut share */
  .share-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;
    border-bottom:1px solid rgba(140,90,255,0.15)}
  .share-row .n{color:var(--text);font-weight:600}
  .share-row .p{color:var(--neon-blue);font-variant-numeric:tabular-nums}

  /* filter bar */
  .filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=text],select{background:rgba(8,4,18,0.85);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:9px 12px;font-size:14px;
    font-family:'Rajdhani',sans-serif;font-weight:500}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--neon-blue);
    box-shadow:0 0 12px rgba(59,157,255,0.4)}
  input.search{flex:1;min-width:220px}
  button{font-family:'Rajdhani',sans-serif;font-weight:700;border:none;border-radius:9px;
    padding:9px 16px;font-size:14px;cursor:pointer;color:#0a0512;
    background:linear-gradient(90deg,var(--neon-green),#7dffb0);
    box-shadow:0 0 14px rgba(57,255,136,0.4)}
  button:hover{transform:translateY(-1px)}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}

  table.tx{width:100%;border-collapse:collapse;font-size:13px}
  table.tx th,table.tx td{padding:9px 11px;border-bottom:1px solid rgba(140,90,255,0.16);text-align:left}
  table.tx th{color:var(--neon-purple);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
    cursor:pointer;user-select:none;position:sticky;top:0;background:rgba(18,8,31,0.96);
    text-shadow:0 0 8px rgba(168,85,247,0.35)}
  table.tx th:hover{color:var(--neon-pink)}
  table.tx td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--neon-green);font-weight:600}
  table.tx tr:hover td{background:rgba(120,60,220,0.1)}
  .tbl-scroll{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:12px}
  .count-note{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.5px}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>OPEN ENTRY</h1>
      <div class="sub">Settlement Dashboard</div>
    </div>
    <div class="up">
      <input type="file" id="file" accept=".xlsx,.xls">
      <span class="tag" id="fileInfo">no file loaded</span>
    </div>
  </div>

  <div id="empty" class="card empty">Upload the OPEN ENTRY .xlsx to load the dashboard.</div>

  <div id="dash" style="display:none">
    <div class="kpis">
      <div class="kpi k1"><div class="lbl">Total Amount</div><div class="val" id="kAmt">₹0</div></div>
      <div class="kpi k2"><div class="lbl">Transactions</div><div class="val" id="kTx">0</div></div>
      <div class="kpi k3"><div class="lbl">Institutes / Parents</div><div class="val" id="kGrp">0</div></div>
      <div class="kpi k4"><div class="lbl">Avg / Transaction</div><div class="val" id="kAvg">₹0</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="section-no">TOP INSTITUTES BY AMOUNT</div>
        <div id="bars"></div>
      </div>
      <div class="card">
        <div class="section-no">SHARE OF TOTAL</div>
        <div id="share"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-no">TRANSACTIONS</div>
      <div class="filterbar">
        <input type="text" class="search" id="search" placeholder="🔍 Search PAY ID, UTR, A/C, remark…" oninput="applyFilters()">
        <select id="fRemark" onchange="applyFilters()"><option value="">All institutes</option></select>
        <input type="text" id="minAmt" placeholder="Min ₹" style="width:110px" oninput="applyFilters()">
        <input type="text" id="maxAmt" placeholder="Max ₹" style="width:110px" oninput="applyFilters()">
        <button class="ghost" onclick="clearFilters()">Clear</button>
        <button onclick="exportCsv()">⬇ Export CSV</button>
      </div>
      <div class="tbl-scroll">
        <table class="tx">
          <thead><tr>
            <th onclick="sortBy('payid')">PAY ID</th>
            <th onclick="sortBy('amount')" style="text-align:right">Amount</th>
            <th onclick="sortBy('acc')">A/C NO</th>
            <th onclick="sortBy('ifsc')">IFSC</th>
            <th onclick="sortBy('utr')">UTR / BANK REF</th>
            <th onclick="sortBy('date')">Date</th>
            <th onclick="sortBy('remark')">Remark</th>
          </tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
      <div class="count-note" id="countNote"></div>
    </div>
  </div>
</div>

<script>
let TX=[];              // all transactions
let FILTERED=[];
let sortKey='amount', sortDir=-1;

document.getElementById('file').addEventListener('change', handleFile);

function handleFile(e){
  const f=e.target.files[0]; if(!f)return;
  document.getElementById('fileInfo').textContent=f.name;
  const reader=new FileReader();
  reader.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
    let sn=wb.SheetNames.find(n=>n.toUpperCase().includes('DATA'))||wb.SheetNames[wb.SheetNames.length-1];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});
    parse(rows);
  };
  reader.readAsArrayBuffer(f);
}
function col(row,keys){
  for(const k of Object.keys(row)){
    const kn=k.toString().toUpperCase().replace(/[^A-Z]/g,'');
    for(const w of keys){ if(kn.includes(w)) return row[k]; }
  }
  return '';
}
function fmtDate(v){
  if(v instanceof Date && !isNaN(v)){
    const d=String(v.getDate()).padStart(2,'0');
    const m=String(v.getMonth()+1).padStart(2,'0');
    return `${d}/${m}/${v.getFullYear()}`;
  }
  return (v||'').toString();
}
function inr(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function inrShort(n){
  n=Number(n);
  if(n>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(n>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  if(n>=1e3) return '₹'+(n/1e3).toFixed(1)+' K';
  return '₹'+n.toFixed(0);
}

function parse(rows){
  TX=[];
  for(const r of rows){
    let name=(col(r,['REMARK'])||'').toString().trim();
    if(!name) name=(col(r,['PAYERNAME','PAYER'])||'').toString().trim();
    if(!name) continue;
    const amt=parseFloat((col(r,['AMOUNT'])+'').replace(/[^0-9.\-]/g,''))||0;
    TX.push({
      payid:(col(r,['PAYID'])||'').toString(),
      amount:amt,
      acc:(col(r,['ACNO'])||'').toString(),
      ifsc:(col(r,['IFSC'])||'').toString(),
      utr:(col(r,['UTR','BANKREF'])||'').toString(),
      date:fmtDate(col(r,['DATE'])),
      remark:name
    });
  }
  document.getElementById('empty').style.display='none';
  document.getElementById('dash').style.display='block';
  buildKpis();buildBars();buildShare();fillRemarkFilter();
  applyFilters();
}

function buildKpis(){
  const total=TX.reduce((s,t)=>s+t.amount,0);
  const groups=new Set(TX.map(t=>t.remark)).size;
  document.getElementById('kAmt').textContent=inrShort(total);
  document.getElementById('kTx').textContent=TX.length;
  document.getElementById('kGrp').textContent=groups;
  document.getElementById('kAvg').textContent=inrShort(TX.length?total/TX.length:0);
}
function groupSums(){
  const m={};
  TX.forEach(t=>{m[t.remark]=(m[t.remark]||0)+t.amount;});
  return Object.entries(m).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
}
function buildBars(){
  const g=groupSums().slice(0,8);
  const max=g.length?g[0].amount:1;
  document.getElementById('bars').innerHTML=g.map(x=>`
    <div class="bar-row">
      <div class="bar-name" title="${x.name}">${x.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(x.amount/max*100).toFixed(1)}%"></div></div>
      <div class="bar-val">${inrShort(x.amount)}</div>
    </div>`).join('');
}
function buildShare(){
  const g=groupSums();
  const total=g.reduce((s,x)=>s+x.amount,0)||1;
  const top=g.slice(0,6);
  const rest=g.slice(6).reduce((s,x)=>s+x.amount,0);
  let html=top.map(x=>`<div class="share-row"><span class="n">${x.name}</span>
     <span class="p">${(x.amount/total*100).toFixed(1)}%</span></div>`).join('');
  if(rest>0) html+=`<div class="share-row"><span class="n">Others (${g.length-6})</span>
     <span class="p">${(rest/total*100).toFixed(1)}%</span></div>`;
  document.getElementById('share').innerHTML=html;
}
function fillRemarkFilter(){
  const names=[...new Set(TX.map(t=>t.remark))].sort();
  const sel=document.getElementById('fRemark');
  sel.innerHTML='<option value="">All institutes</option>'+names.map(n=>`<option>${n}</option>`).join('');
}

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const rem=document.getElementById('fRemark').value;
  const mn=parseFloat(document.getElementById('minAmt').value)||-Infinity;
  const mx=parseFloat(document.getElementById('maxAmt').value)||Infinity;
  FILTERED=TX.filter(t=>{
    if(rem && t.remark!==rem) return false;
    if(t.amount<mn||t.amount>mx) return false;
    if(q){
      const hay=(t.payid+' '+t.utr+' '+t.acc+' '+t.ifsc+' '+t.remark).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  sortData();renderTable();
}
function clearFilters(){
  document.getElementById('search').value='';
  document.getElementById('fRemark').value='';
  document.getElementById('minAmt').value='';
  document.getElementById('maxAmt').value='';
  applyFilters();
}
function sortBy(k){
  if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=(k==='amount')?-1:1;}
  sortData();renderTable();
}
function sortData(){
  FILTERED.sort((a,b)=>{
    let x=a[sortKey],y=b[sortKey];
    if(sortKey==='amount'){return (x-y)*sortDir;}
    return (''+x).localeCompare(''+y)*sortDir;
  });
}
function renderTable(){
  const tb=document.getElementById('txBody');
  tb.innerHTML=FILTERED.map(t=>`<tr>
    <td>${t.payid}</td>
    <td class="num">${inr(t.amount)}</td>
    <td>${t.acc}</td>
    <td>${t.ifsc}</td>
    <td>${t.utr}</td>
    <td>${t.date}</td>
    <td>${t.remark}</td>
  </tr>`).join('');
  const sum=FILTERED.reduce((s,t)=>s+t.amount,0);
  document.getElementById('countNote').textContent=
    `Showing ${FILTERED.length} of ${TX.length} transactions · Filtered total: ${inr(sum)}`;
}
function exportCsv(){
  let csv='PAY ID,Amount,A/C NO,IFSC,UTR,Date,Remark\n';
  FILTERED.forEach(t=>{
    csv+=`"${t.payid}",${t.amount},"${t.acc}","${t.ifsc}","${t.utr}","${t.date}","${t.remark}"\n`;
  });
  const b=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='filtered_transactions.csv';a.click();
}
</script>
</body>
</html>
